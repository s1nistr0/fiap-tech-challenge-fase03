apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-sa
  namespace: evaluation
  annotations:
    # irsa: o pod pega credencial temporaria por esta role.
    # so manda na fila. nao le, nao apaga, nao toca no dynamodb.
    eks.amazonaws.com/role-arn: arn:aws:iam::541754963625:role/togglemaster-evaluation-irsa
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: evaluation-config
  namespace: evaluation
data:
  PORT: "8004"
  AWS_REGION: "us-east-1"
  FLAG_SERVICE_URL: "http://flag-service.flags.svc.cluster.local:8002"
  TARGETING_SERVICE_URL: "http://targeting-service.targeting.svc.cluster.local:8003"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: evaluation
  labels:
    app: evaluation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      # sem isso o pod usa a service account "default", que nao
      # tem role nenhuma, e o sdk da aws falha ao autenticar
      serviceAccountName: evaluation-sa
      terminationGracePeriodSeconds: 45
      containers:
        - name: evaluation-service
          image: 541754963625.dkr.ecr.us-east-1.amazonaws.com/togglemaster/evaluation-service:v1.0.0-6d1b69a
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: evaluation-config
            - secretRef:
                name: evaluation-secret
          resources:
            requests:
              # request baixo de proposito: o HPA calcula a utilizacao em cima do request,
              # nao do limit. com request alto a carga da demo nunca chega nos 70%.
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                # da tempo do endpoint sumir do service antes do SIGTERM chegar.
                # sem isso o nginx ainda manda request pro pod que ja esta morrendo.
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-service
  namespace: evaluation
spec:
  type: ClusterIP
  selector:
    app: evaluation-service
  ports:
    - port: 8004
      targetPort: 8004
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evaluation-ingress
  namespace: evaluation
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /evaluate
            pathType: Prefix
            backend:
              service:
                name: evaluation-service
                port:
                  number: 8004
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evaluation-hpa
  namespace: evaluation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evaluation-service
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # sobe rapido pra demo nao ficar parada esperando a janela default de estabilizacao
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
